[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[project]
name = "version-project"
version = "0.0.0"
description = "Project for version upgrade check within Kraken-std integration tests"
authors = [
    "Szymon Gula <szymon.gula@helsing.ai>",
]
packages = [
    { include = "version_project", from = "src" },
]
requires-python = ">=3.10"
