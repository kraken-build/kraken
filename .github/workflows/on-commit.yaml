name: "On Commit"

on:
  push: { branches: [ "develop" ], tags: [ "*" ] }
  pull_request: { branches: [ "*" ] }

env:
  COLUMNS: 200

jobs:

  documentation:
    uses: ./.github/workflows/build-docs.yaml

  typos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: jdx/mise-action@v2
    - run: typos

  check:
    uses: ./.github/workflows/run-krakenw.yaml
    with:
      targets: check

  lint:
    uses: ./.github/workflows/run-krakenw.yaml
    with:
      targets: lint

  test:
    uses: ./.github/workflows/run-krakenw.yaml
    name: Test Python v${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    with:
      targets: test
      python-version: ${{ matrix.python-version }}

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Build dist
        run:
          uv build kraken-build
          uv build kraken-wrapper

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
