name: Python

on:
  push: { branches: [ "develop" ], tags: [ "*" ] }
  pull_request: { branches: [ "*" ] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COLUMNS: 200

jobs:
  typos:
    name: Check for typos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: jdx/mise-action@v3
    - run: typos

  check:
    name: Check
    uses: ./.github/workflows/.run-krakenw.yaml
    with:
      targets: check

  lint:
    name: Lint
    uses: ./.github/workflows/.run-krakenw.yaml
    with:
      targets: lint

  test:
    name: Test with py-${{ matrix.python-version }}
    uses: ./.github/workflows/.run-krakenw.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    with:
      targets: test -X pytest-e2e
      python-version: ${{ matrix.python-version }}

  test-e2e:
    name: Test end-to-end
    uses: ./.github/workflows/.run-krakenw.yaml
    with:
      targets: pytest-e2e
      python-version: "3.14"
      pytest-flags: --numprocesses 4

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3

      - name: Build dist
        run: |
          uv build -o dist/ kraken-build
          uv build -o dist/ kraken-wrapper

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
